@import url("https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap");*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}:root{--bg-deep:#0A0806;--bg:#12100D;--bg-surface:#1C1813;--ink:#EBE5D8;--ink-dim:#A89E8E;--ink-muted:#6B6255;--line:#332D24;--line-soft:#262018;--accent:#C9A96E;--accent-light:#E8CD8A;--accent-dim:#8A6D40;--serif:"Noto Serif SC","SimSun",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}html{scroll-behavior:smooth;background:var(--bg-deep);}body{font-family:var(--sans);background:var(--bg-deep);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;}::selection{background:var(--accent-dim);color:#fff;}::-webkit-scrollbar{width:0;}.noise{position:fixed;inset:0;z-index:9990;pointer-events:none;opacity:0.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;background:linear-gradient(180deg,rgba(10,8,6,0.95) 0%,rgba(10,8,6,0.7) 80%,transparent 100%);}.topbar-logo{font-family:var(--serif);font-size:1.3rem;font-weight:700;letter-spacing:0.12em;color:var(--ink);}.topbar-logo .dot{color:var(--accent);}.topbar-actions{display:flex;align-items:center;gap:0.8rem;}.topbar-btn{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:0.45rem 1rem;font-family:var(--sans);font-size:0.72rem;letter-spacing:0.08em;cursor:pointer;transition:all 0.35s var(--ease);}.topbar-btn:hover{border-color:var(--accent-dim);color:var(--ink);}.topbar-btn--icon{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;font-size:1rem;}.search-dropdown{position:relative;}.search-panel{position:absolute;top:calc(100% + 8px);right:0;width:260px;background:rgba(28,24,19,0.96);backdrop-filter:blur(16px);border:1px solid var(--line);padding:0.8rem;display:none;z-index:10;}.search-panel.open{display:block;}.search-panel input{width:100%;border:none;outline:none;background:transparent;font-family:var(--serif);font-size:0.85rem;color:var(--ink);padding:0.4rem 0;border-bottom:1px solid var(--line);}.search-panel input::placeholder{color:var(--ink-muted);}.search-results{max-height:200px;overflow-y:auto;margin-top:0.4rem;}.search-result-item{padding:0.4rem 0.5rem;cursor:pointer;font-size:0.75rem;color:var(--ink-dim);transition:all 0.2s;border-bottom:1px solid var(--line-soft);}.search-result-item:hover{color:var(--accent-light);background:rgba(201,169,110,0.06);}.wall{width:100%;min-height:100vh;padding:5rem 0.5rem 7rem 0.5rem;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:dense;grid-auto-rows:minmax(18vw,1fr);gap:3px;position:relative;background:rgba(201,169,110,0.04);filter:sepia(0.18) hue-rotate(-5deg) saturate(0.85);}.wall-tile{position:relative;cursor:pointer;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:transparent;transition:filter 0.5s var(--ease),opacity 0.5s var(--ease),transform 0.15s var(--ease),box-shadow 0.5s var(--ease);z-index:1;}.wall-tile::after{content:"";position:absolute;inset:0;pointer-events:none;}.wall-tile:hover{z-index:3;filter:sepia(0.1) hue-rotate(-3deg) saturate(1);}.wall-tile:hover::after{}.wall-tile.dimmed{filter:none;opacity:0.18;pointer-events:none;}.wall-tile.selected{filter:none;z-index:5;opacity:0;}.wall-tile.pulse{animation:pulse-gold 2.2s ease-in-out infinite;}.wall-tile.pulse::after{background:rgba(10,8,6,0.35);}.wall-tile.hidden{display:none;}@keyframes pulse-gold{0%,100%{box-shadow:0 0 0px rgba(201,169,110,0);}50%{box-shadow:0 0 24px rgba(201,169,110,0.35),inset 0 0 24px rgba(201,169,110,0.1);}}.wall-tile.span-c2{grid-column:span 2;}.wall-tile.span-r2{grid-row:span 2;}.floating-artifact{position:fixed;z-index:50;pointer-events:none;width:55vmin;height:55vmin;background-size:cover;background-position:center;filter:none;transition:all 0.65s cubic-bezier(0.22,1,0.36,1);box-shadow:0 0 80px rgba(201,169,110,0.15),0 20px 60px rgba(0,0,0,0.5);opacity:0;transform:scale(0.3);}.floating-artifact.visible{opacity:1;transform:scale(1);pointer-events:auto;}.card-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:flex-end;padding:2rem 3rem;opacity:0;pointer-events:none;transition:opacity 0.4s var(--ease);}.card-overlay.active{opacity:1;pointer-events:auto;}.card{width:100%;max-width:480px;background:rgba(28,24,19,0.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-top:1px solid var(--accent-dim);padding:2.5rem 2.8rem;border-radius:4px;transform:translateX(40px);transition:transform 0.5s var(--ease);box-shadow:0 4px 40px rgba(0,0,0,0.4);}.card-overlay.active .card{transform:translateX(0);}.card-name{font-family:var(--serif);font-size:1.7rem;font-weight:600;letter-spacing:0.05em;margin-bottom:0.3rem;}.card-era{font-size:0.72rem;color:var(--accent-dim);letter-spacing:0.1em;margin-bottom:1.2rem;}.card-essence{font-family:var(--serif);font-size:1rem;font-weight:300;line-height:1.85;color:var(--ink-dim);margin-bottom:2rem;padding-left:0.8rem;border-left:1px solid var(--accent-dim);}.card-actions{display:flex;gap:0.8rem;align-items:center;}.card-btn{padding:0.6rem 1.5rem;border:1px solid var(--line);background:transparent;font-family:var(--sans);font-size:0.72rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.35s var(--ease);color:var(--ink-dim);}.card-btn:hover{border-color:var(--accent);color:var(--accent-light);}.card-btn--primary{border-color:var(--accent-dim);color:var(--accent-light);}.card-btn--close{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;margin-left:auto;font-size:1rem;}.analysis-overlay{position:fixed;inset:0;z-index:70;background:rgba(10,8,6,0.97);overflow-y:auto;display:none;}.analysis-overlay.active{display:block;}.analysis-close{position:fixed;top:1.5rem;right:1.5rem;z-index:71;background:transparent;border:1px solid var(--line);color:var(--ink-dim);width:40px;height:40px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.35s var(--ease);}.analysis-close:hover{border-color:var(--accent);color:var(--ink);}.analysis-inner{width:100%;max-width:860px;margin:0 auto;padding:5rem 2rem;}.analysis-header{text-align:center;margin:2rem 0 3.5rem;}.analysis-header .name{font-family:var(--serif);font-size:2.4rem;font-weight:600;letter-spacing:0.05em;margin-bottom:0.4rem;}.analysis-header .era{font-size:0.8rem;color:var(--accent-dim);letter-spacing:0.1em;}.analysis-step{margin-bottom:3.5rem;opacity:0;transform:translateY(30px);transition:all 0.7s var(--ease);}.analysis-step.revealed{opacity:1;transform:translateY(0);}.step-label{font-family:var(--sans);font-size:0.6rem;letter-spacing:0.35em;color:var(--accent-dim);margin-bottom:1rem;}.step-q{font-family:var(--serif);font-size:1.25rem;font-weight:600;letter-spacing:0.04em;line-height:1.4;margin-bottom:1rem;}.step-a{font-family:var(--serif);font-size:0.88rem;font-weight:300;line-height:2;color:var(--ink-dim);}.step-connector{width:1px;height:36px;background:var(--accent-dim);margin:0 auto 2rem;opacity:0.3;}.recommend-strip{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--line);animation:fadeInUp 0.7s var(--ease) both;}@keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.recommend-strip h4{font-family:var(--sans);font-size:0.65rem;letter-spacing:0.25em;color:var(--ink-muted);margin-bottom:1.2rem;}.recommend-row{display:flex;gap:0.8rem;overflow-x:auto;padding-bottom:0.5rem;}.recommend-card{flex-shrink:0;width:180px;padding:1rem;border:1px solid var(--line-soft);cursor:pointer;transition:all 0.3s var(--ease);}.recommend-card:hover{border-color:var(--accent-dim);background:rgba(201,169,110,0.04);}.recommend-card .rc-name{font-family:var(--serif);font-size:0.85rem;font-weight:500;margin-bottom:0.3rem;}.recommend-card .rc-era{font-size:0.65rem;color:var(--ink-muted);letter-spacing:0.06em;}.recommend-card .rc-essence{font-family:var(--serif);font-size:0.68rem;font-weight:300;line-height:1.6;color:var(--ink-dim);margin-top:0.6rem;}.filter-bar{position:fixed;bottom:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:center;gap:0;padding:1rem 2rem;background:linear-gradient(0deg,rgba(10,8,6,0.95) 0%,rgba(10,8,6,0.7) 80%,transparent 100%);transition:opacity 0.4s var(--ease);}.filter-bar.hidden{opacity:0;pointer-events:none;}.filter-group{display:flex;align-items:center;gap:0;}.filter-sep{width:1px;height:14px;background:var(--line);margin:0 0.8rem;}.filter-btn{background:transparent;border:none;color:var(--ink-muted);font-family:var(--sans);font-size:0.65rem;letter-spacing:0.1em;padding:0.35rem 0.7rem;cursor:pointer;transition:all 0.3s var(--ease);}.filter-btn:hover,.filter-btn.active{color:var(--accent-light);}.filter-btn.active{border-bottom:1px solid var(--accent-dim);}
.step-continue{margin-top:1.2rem;text-align:center;}.step-continue-btn{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:0.5rem 1.8rem;font-family:var(--sans);font-size:0.68rem;letter-spacing:0.12em;cursor:pointer;transition:all 0.35s var(--ease);}.step-continue-btn:hover{border-color:var(--accent);color:var(--accent-light);}
.step-connector-kw{display:flex;align-items:center;justify-content:center;gap:0.6rem;margin:0 auto 1.8rem;max-width:400px;opacity:0;transform:translateY(10px);transition:all 0.6s var(--ease);}.step-connector-kw.revealed{opacity:1;transform:translateY(0);}
.connector-line{flex-shrink:0;width:40px;height:1px;background:var(--accent-dim);}
.connector-keyword{font-family:var(--serif);font-size:0.7rem;font-weight:300;color:var(--accent);letter-spacing:0.06em;white-space:nowrap;padding:0.2rem 0.6rem;border:1px solid rgba(201,169,110,0.2);border-radius:2px;}
.wall-flashlight{position:fixed;inset:0;z-index:49;pointer-events:none;opacity:0;transition:opacity 0.5s var(--ease);background:radial-gradient(circle 280px at 50% 50%,transparent 0%,rgba(10,8,6,0.35) 60%,rgba(10,8,6,0.7) 100%);}
.wall-flashlight.active{opacity:1;}
.compare-view{position:fixed;inset:0;z-index:80;background:rgba(10,8,6,0.97);display:none;flex-direction:row;align-items:stretch;}
.compare-view.active{display:flex;}
.compare-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4rem 2rem;overflow-y:auto;}
.compare-divider{width:1px;background:var(--line);flex-shrink:0;}
.compare-img{width:40vmin;height:40vmin;background-size:cover;background-position:center;margin-bottom:2rem;border:1px solid var(--line);box-shadow:0 0 40px rgba(201,169,110,0.1);}
.compare-name{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin-bottom:0.3rem;}
.compare-era{font-size:0.72rem;color:var(--accent-dim);letter-spacing:0.1em;margin-bottom:1.2rem;}
.compare-topic{font-family:var(--sans);font-size:0.6rem;letter-spacing:0.3em;color:var(--ink-muted);margin:1.5rem 0 0.8rem;text-align:center;}
.compare-a{font-family:var(--serif);font-size:0.82rem;font-weight:300;line-height:1.9;color:var(--ink-dim);max-width:420px;text-align:center;}
.flashlight-off .wall-flashlight{opacity:0!important;transition:opacity 1s var(--ease);}
@media (max-width:768px){.compare-view{flex-direction:column;}.compare-divider{width:100%;height:1px;}.compare-col{padding:2rem 1rem;}.compare-img{width:50vmin;height:50vmin;}.wall-flashlight{display:none;}}
@media (max-width:768px){.wall{grid-template-columns:repeat(2,1fr);padding:4rem 0.3rem 6rem;grid-auto-rows:minmax(35vw,1fr);}.wall-tile.span-c2{grid-column:span 2;}.floating-artifact{width:80vmin;height:80vmin;}.card-overlay{align-items:flex-end;justify-content:center;padding:1rem;}.card{max-width:100%;transform:translateY(40px);}.card-overlay.active .card{transform:translateY(0);}.topbar{padding:0.8rem 1rem;}.topbar-logo{font-size:1.1rem;}.filter-bar{padding:0.8rem 0.5rem;}.filter-btn{font-size:0.6rem;padding:0.3rem 0.45rem;}.filter-sep{margin:0 0.3rem;}.analysis-inner{padding:4rem 1.2rem;}}@media (pointer:coarse){.wall-tile:hover{filter:sepia(0.25) hue-rotate(-8deg) saturate(0.75);}.wall-tile:hover::after{background:rgba(10,8,6,0.35);}}
/* ===== 忆古交互与动效增强（P0-P2 全部落地） ===== */
.mode-toggle{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
.mode-btn{background:transparent;border:none;color:var(--ink-muted);font-family:var(--sans);font-size:0.65rem;letter-spacing:0.1em;padding:0.45rem 0.9rem;cursor:pointer;transition:all 0.3s var(--ease);}
.mode-btn:hover{color:var(--ink);}
.mode-btn.active{color:var(--accent-light);background:rgba(201,169,110,0.1);box-shadow:inset 0 -1px 0 var(--accent-dim);}
.scroll-progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:120;background:linear-gradient(90deg,var(--accent-dim),var(--accent-light));pointer-events:none;transition:width 0.12s linear;}
.wall-veiled{transform:scale(0.965);opacity:0.5;filter:blur(5px);pointer-events:none;}
.wall{transition:transform 0.6s var(--ease),opacity 0.6s var(--ease),filter 0.6s var(--ease);}
.wall-tile.tile-pre{opacity:0;transform:translateY(16px) scale(0.96);}
.wall-tile.tile-in{animation:tile-in 0.7s var(--ease);}
@keyframes tile-in{from{opacity:0;transform:translateY(16px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.wall-tile.tile-hide{opacity:0 !important;transform:scale(0.9);}
.wall-tile.tile-appear{animation:tile-appear 0.5s var(--ease) both;}
@keyframes tile-appear{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.ripple{position:fixed;z-index:55;width:14px;height:14px;border-radius:50%;border:1px solid var(--accent);pointer-events:none;animation:ripple-out 0.75s var(--ease) forwards;}
@keyframes ripple-out{from{transform:scale(0.5);opacity:0.9;}to{transform:scale(16);opacity:0;}}
.explore-view{position:fixed;inset:0;z-index:41;background:var(--bg-deep);overflow-y:auto;display:none;padding:6rem 2rem 9rem;opacity:0;transition:opacity 0.45s var(--ease);}
.explore-view.active{display:block;}
.explore-view.fade-in{opacity:1;}
.explore-head{max-width:1200px;margin:0 auto 2rem;position:relative;text-align:center;}
.explore-head h2{font-family:var(--serif);font-size:1.6rem;font-weight:500;letter-spacing:0.06em;margin:0 auto;}
.explore-head p{font-family:var(--serif);font-size:0.8rem;font-weight:300;color:var(--ink-muted);margin-top:0.4rem;margin-bottom:0;}
.explore-head .explore-back{position:absolute;left:0;top:0;margin-bottom:0;}
.explore-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;max-width:1200px;margin:0 auto;}
.explore-card{position:relative;border:1px solid var(--line);background:var(--bg-surface);cursor:pointer;transition:transform 0.35s var(--ease),border-color 0.35s var(--ease),box-shadow 0.35s var(--ease);overflow:hidden;}
.explore-card:hover{transform:translateY(-6px);border-color:var(--accent-dim);box-shadow:0 10px 30px rgba(0,0,0,0.35);}
.explore-card.checked{border-color:var(--accent);}
.explore-img{width:100%;aspect-ratio:1/1;background-size:cover;background-position:center;background-color:var(--bg-surface);}
.explore-info{padding:1rem 1.1rem 1.3rem;}
.explore-name{font-family:var(--serif);font-size:1.02rem;font-weight:600;margin-bottom:0.2rem;}
.explore-era{font-size:0.64rem;color:var(--accent-dim);letter-spacing:0.08em;margin-bottom:0.6rem;}
.explore-question{font-family:var(--serif);font-size:0.74rem;font-weight:300;line-height:1.75;color:var(--ink-dim);}
.explore-card.checked{border-color:var(--accent);box-shadow:0 0 0 1px rgba(201,169,110,0.6),0 0 36px rgba(201,169,110,0.22);transform:translateY(-3px);}
.explore-card.checked::after{content:"✓";position:absolute;top:0.7rem;right:0.7rem;width:27px;height:27px;border-radius:50%;background:linear-gradient(180deg,#E8CD8A,#C9A96E);color:#14100A;font-size:0.8rem;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 0 16px rgba(201,169,110,0.55);}
.compare-bar{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%) translateY(20px);z-index:96;display:flex;gap:0.8rem;align-items:center;padding:0.65rem 1.2rem;background:rgba(28,24,19,0.97);border:1px solid var(--line);border-top:1px solid var(--accent-dim);opacity:0;pointer-events:none;transition:all 0.4s var(--ease);}
.compare-bar.active{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.compare-bar-names{font-family:var(--serif);font-size:0.78rem;color:var(--ink-dim);}
.compare-bar-btn{border:1px solid var(--accent-dim);background:transparent;color:var(--accent-light);font-family:var(--sans);font-size:0.68rem;letter-spacing:0.1em;padding:0.45rem 1.1rem;cursor:pointer;transition:all 0.3s var(--ease);}
.compare-bar-btn:hover{background:rgba(201,169,110,0.12);}
.compare-bar-clear{background:transparent;border:none;color:var(--ink-muted);font-size:0.7rem;cursor:pointer;padding:0.3rem;}
.compare-bar-clear:hover{color:var(--ink);}
.compare-dims{display:flex;gap:0.4rem;justify-content:center;margin:1.2rem 0 1.4rem;}
.compare-dim-btn{border:1px solid var(--line);background:transparent;color:var(--ink-muted);font-family:var(--sans);font-size:0.65rem;letter-spacing:0.12em;padding:0.35rem 0.9rem;cursor:pointer;transition:all 0.3s var(--ease);}
.compare-dim-btn:hover{color:var(--ink);}
.compare-dim-btn.active{color:var(--accent-light);border-color:var(--accent-dim);background:rgba(201,169,110,0.08);}
.step-connector-kw{will-change:transform,opacity;}
.connector-line{transform:scaleX(0);transform-origin:center;transition:transform 0.55s var(--ease);}
.step-connector-kw.revealed .connector-line{transform:scaleX(1);}
.analysis-step{will-change:transform,opacity;}
.step-continue-btn:hover{border-color:var(--accent);color:var(--accent-light);box-shadow:0 0 20px rgba(201,169,110,0.18);}
.rc-tag{display:inline-block;font-size:0.6rem;color:var(--accent);border:1px solid rgba(201,169,110,0.28);padding:0.12rem 0.5rem;border-radius:2px;margin-top:0.55rem;letter-spacing:0.05em;}
.search-result-item mark{background:rgba(201,169,110,0.28);color:var(--accent-light);padding:0 1px;}
.interest-hint{display:inline-block;font-size:0.6rem;letter-spacing:0.2em;color:var(--accent-dim);margin-top:0.7rem;border:1px solid rgba(201,169,110,0.22);padding:0.22rem 0.7rem;border-radius:2px;}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px;}
.floating-artifact,.card,.analysis-step,.explore-card,.wall-tile{will-change:transform,opacity;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}}
@media (max-width:768px){.explore-view{padding:5.2rem 0.8rem 8rem;}.explore-grid{grid-template-columns:repeat(2,1fr);gap:0.6rem;}.explore-info{padding:0.7rem 0.8rem 0.9rem;}.explore-name{font-size:0.88rem;}.explore-question{font-size:0.68rem;}.mode-btn{font-size:0.6rem;padding:0.38rem 0.65rem;}.compare-bar{bottom:3.6rem;width:calc(100% - 1.6rem);justify-content:center;}.compare-bar-names{max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.compare-dims{margin:0.8rem 0 1rem;}.compare-dim-btn{padding:0.3rem 0.7rem;}.scroll-progress{height:2px;}}
/* ===== 返回键与对比表格（二轮优化） ===== */
.overlay-back{position:fixed;top:1.2rem;left:1.2rem;z-index:101;background:rgba(10,8,6,0.88);border:1px solid var(--accent-dim);color:var(--accent-light);padding:0.55rem 1.2rem;font-family:var(--sans);font-size:0.75rem;letter-spacing:0.12em;cursor:pointer;transition:all 0.35s var(--ease);}
.overlay-back:hover{border-color:var(--accent);color:#fff;background:rgba(201,169,110,0.15);}

  {

    "name": "建窑兔毫盏",
    "era": "南宋 · 约900年前",
    "dynasty": "南宋",
    "tag": "song",
    "mtag": "ceramic",
    "essence": "铁在火里的结晶——当工艺缺陷成为审美起点",
    "img": "artifact-wall/w01.jpg",

      {

        "q": "为什么口沿有一圈白边？",
        "a": "这圈白边被称为兔毫的出毫点——高温下釉料向下流动，口沿处的釉层变薄，露出胎土的本色。它最初是工艺上的缺陷，但宋人选择保留而非掩盖，因为那圈浅色恰好为黑色盏壁提供了一道呼吸的边缘。这是中国工匠对工艺痕迹最早的审美化处理。"
      },
      {
        "dim": "material",
        "q": "为什么釉面是黑色的？",
        "a": "建窑的黑釉并非后期涂抹，而是胎土本身含铁量高达7%—10%。在1280℃的还原焰中，铁元素从釉中析出、在表面结晶，形成细如兔毫的金色纹路——这不是画上去的，是铁在火里的舞蹈。宋代斗茶崇尚白茶，黑盏最能衬托白色茶沫，这是功能需求对审美的反向塑造。"

        "q": "为什么盏壁这么厚？",
        "a": "厚壁是为了保温。宋代斗茶需要保持茶汤温度，厚壁能延缓热量散失。同时厚胎在高温烧制时不易变形——含铁量极高的胎土在1280℃下极易软化，厚壁是结构的必然。建盏口沿微微内收，注水时防溅，同时引导视线向盏心聚焦——宋代匠人用最少的造型投入，同时解决了保温、结构、防溅和视觉引导四个问题。"

(function buildWall() {
  wall.innerHTML = '';

  TILES.forEach(function(tile, idx) {
    var el = document.createElement('div');
    el.className = 'wall-tile tile-pre';
    el.style.backgroundImage = 'none';
    el.dataset.index = idx;
    el.dataset.img = tile.img || '';
    if (tile.id) el.dataset.artifactId = tile.id;
    if (tile.colSpan === 2) el.classList.add('span-c2');
    if (tile.rowSpan === 2) el.classList.add('span-r2');
    el.addEventListener('click', function(ev) {
      if (tile.id) { spawnRipple(ev.clientX, ev.clientY); selectArtifact(tile.id, el); }
    });
    wall.appendChild(el);
    tiles.push({ el: el, tile: tile });
  });
  // 入场动画：逐批浮现（staggered，模拟"展馆开灯"）
  tiles.forEach(function(t, i) {
    setTimeout(function() { t.el.classList.add('tile-in'); t.el.classList.remove('tile-pre'); }, 60 + Math.floor(i / 5) * 60);
  });
  // 懒加载：tile 进入视口才设置背景图（首屏前 6 个立即加载）
  if ('IntersectionObserver' in window) {
    var imgObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(en) {
        if (en.isIntersecting && !en.target.dataset.loaded) {
          en.target.dataset.loaded = '1';
          en.target.style.backgroundImage = 'url(' + en.target.dataset.img + ')';
          imgObserver.unobserve(en.target);
        }
      });
    }, { rootMargin: '120px' });
    tiles.forEach(function(t) { imgObserver.observe(t.el); });
    tiles.slice(0, 6).forEach(function(t) {
      if (!t.el.dataset.loaded) {
        t.el.dataset.loaded = '1';
        t.el.style.backgroundImage = 'url(' + (t.tile.img || '') + ')';
        if (imgObserver) imgObserver.unobserve(t.el);
      }
    });
  } else {
    tiles.forEach(function(t) {
      t.el.style.backgroundImage = 'url(' + (t.tile.img || '') + ')';
    });
  }
})();

function extractKeywords(text) {
  var stop = ['的','是','在','了','和','与','或','而','但','不','它','这','那','也','被','把','从','向','对','为','以','到','着','之','中','上','下','出','有','一个','一种','不是','没有','通过','因为','所以','这些','那些','自己','可以','我们','他们','这个','那个'];
  var words = text.replace(/[，。、；：？！""''（）《》【】\s]/g,' ').split(' ').filter(function(w){return w.length>=2&&stop.indexOf(w)<0;});
  var freq = {};
  words.forEach(function(w){freq[w]=freq[w]?freq[w]+1:1;});
  return Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];}).slice(0,8);
}

  });
}

  // 兴趣锚点（A3）：按浏览者历史兴趣权重（sessionStorage）重排分析维度
  var ordered = a.analyses.slice().sort(function(x, y) {
    return (interest[y.dim] || 0) - (interest[x.dim] || 0);
  });
  var h = '<div class="analysis-header"><div class="name">' + a.name + '</div><div class="era">' + a.era + '</div>';

    if (i < a.analyses.length - 1) {
      var prevKw = extractKeywords(a.analyses[i].a);
      var nextKw = extractKeywords(a.analyses[i + 1].a);
      var shared = prevKw.filter(function(k) { return nextKw.indexOf(k) >= 0; });
      if (shared.length > 0) {
        h += '<div class="step-connector-kw" data-connector="' + i + '"><span class="connector-line"></span><span class="connector-keyword">' + shared[0] + '</span><span class="connector-line"></span></div>';
      }
      h += '<div class="step-continue" data-continue="' + i + '"><button class="step-continue-btn" data-target="' + (i+1) + '">继续 ↓</button></div>';
    }
  });
  // Related section injected after all steps revealed
  analysisInner.innerHTML = h;
  analysisOverlay.classList.add('active');
  startInterestTracking();
  setTimeout(function() { revealNextStep(); }, 300);
  // 仅显示第一条后的"继续"按钮，其余随段落逐步解锁
  var firstContinue = analysisInner.querySelector('.step-continue[data-continue="0"]');
  if (firstContinue) firstContinue.classList.add('show');
  document.querySelectorAll('.step-continue-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var target = parseInt(btn.dataset.target);
      var step = analysisInner.querySelector('.analysis-step[data-step="' + target + '"]');
      if (step) { step.classList.add('revealed'); state.revealedSteps = Math.max(state.revealedSteps, target + 1); updateUrl(); step.scrollIntoView({behavior:'smooth',block:'center'}); }
      var allSt = analysisInner.querySelectorAll('.analysis-step');
      var revSt = analysisInner.querySelectorAll('.analysis-step.revealed');
      if (allSt.length > 0 && revSt.length === allSt.length) { injectRecommendStrip(); }
      var el = btn.parentElement;
      var ci = el && el.dataset ? parseInt(el.dataset.continue) : -1;
      if (!isNaN(ci) && ci >= 0) {
        var conn = analysisInner.querySelector('.step-connector-kw[data-connector="' + ci + '"]');
        if (conn) setTimeout(function(){ conn.classList.add('revealed'); }, 300);
        var nextBtn = analysisInner.querySelector('.step-continue[data-continue="' + (ci + 1) + '"]');
        if (nextBtn) setTimeout(function(){ nextBtn.classList.add('show'); }, 260);
      }
    });
  });
  showGlobalBack();
}

function revealStep(step, delay) {
  if (!step || step.classList.contains('revealed')) return;
  setTimeout(function() {
    step.classList.add('revealed');
    state.revealedSteps = Math.max(state.revealedSteps, parseInt(step.dataset.step) + 1);
    updateUrl();
    // 全部 reveal 后注入推荐条
    var allSt = analysisInner.querySelectorAll('.analysis-step');
    var revSt = analysisInner.querySelectorAll('.analysis-step.revealed');
    if (allSt.length > 0 && revSt.length === allSt.length) injectRecommendStrip();
  }, delay || 0);
}

function revealNextStep() {
  var step = analysisInner.querySelector('.analysis-step[data-step="' + state.revealedSteps + '"]');
  if (step && !step.classList.contains('revealed')) { step.classList.add('revealed'); state.revealedSteps++; updateUrl(); }
  // Check if all steps revealed - if so, inject related recommendations
  var allSteps = analysisInner.querySelectorAll('.analysis-step');
  var revealedSteps = analysisInner.querySelectorAll('.analysis-step.revealed');
  if (allSteps.length > 0 && revealedSteps.length === allSteps.length) {
    injectRecommendStrip();
  }
}

function injectRecommendStrip() {
  var a = artifactById[state.selectedId];
  if (!a) return;
  // Don't inject twice
  if (analysisInner.querySelector('.recommend-strip')) return;
  var related = ARTIFACTS.filter(function(r) {
    return r.id !== a.id && (r.dynasty === a.dynasty || r.mtag === a.mtag);
  }).slice(0, 5);
  if (related.length === 0) return;
  var h = '<div class="recommend-strip"><h4>相关推荐</h4><div class="recommend-row">';
  related.forEach(function(r) {
    var tags = [];
    if (r.dynasty === a.dynasty) tags.push('同朝代');
    if (r.mtag === a.mtag) tags.push('同材质');
    if (tags.length === 0) tags.push('同源');
    var tagHtml = '<span class="rc-tag">' + tags.join(' · ') + '</span>';
    h += '<div class="recommend-card" onclick="navigateTo(\'' + r.id + '\')"><div class="rc-name">' + r.name + '</div><div class="rc-era">' + r.era + '</div><div class="rc-essence">' + r.essence.substring(0, 60) + '...</div>' + tagHtml + '</div>';
  });
  h += '</div></div>';
  analysisInner.insertAdjacentHTML('beforeend', h);
}

  document.querySelectorAll('.wall-tile').forEach(function(tile) {

    var a = artifactById[id];
    if (!a) { tile.classList.add('hidden'); return; }
    var show = (filter === 'all') ||
      (filter.indexOf('dynasty:') === 0 && a.dynasty === filter.split(':')[1]) ||
      (filter.indexOf('mtag:') === 0 && a.mtag === filter.split(':')[1]);
    if (show) {
      if (tile.classList.contains('hidden')) {
        tile.classList.remove('hidden', 'tile-hide');

        setTimeout(function() { tile.classList.remove('tile-appear'); }, 600);

  if (state.activeFilter !== 'all') p.set('filter', state.activeFilter);
  if (state.mode !== 'guide') p.set('mode', state.mode);
  if (state.compareIds && state.compareIds.length === 2) { p.set('a', state.compareIds[0]); p.set('b', state.compareIds[1]); }
  var url = p.toString() ? '?' + p.toString() : window.location.pathname;
  history.pushState(state, '', url);
}

function restoreFromUrl() {

  if (q) {

function updateSearchResults(query) {
  searchResults.innerHTML = '';
  if (!query.trim()) { searchResults.classList.remove('open'); return; }
  var q = query.trim().toLowerCase();
  var matches = ARTIFACTS.filter(function(a) {
    return a.name.toLowerCase().indexOf(q) >= 0 || a.dynasty.toLowerCase().indexOf(q) >= 0;
  });
  if (matches.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'search-result-item';
    empty.style.color = 'var(--ink-muted)';
    empty.textContent = '未找到相关文物';
    searchResults.appendChild(empty);
    searchResults.classList.add('open');
    return;
  }
  matches.forEach(function(a) {
    var item = document.createElement('div');
    item.className = 'search-result-item';
    item.innerHTML = highlightMatch(a.name + ' / ' + a.era, q);
    item.addEventListener('click', function() { searchResults.classList.remove('open'); searchInput.value = ''; navigateTo(a.id); });
    searchResults.appendChild(item);
  });
  searchResults.classList.add('open');
}

function highlightMatch(text, q) {
  var idx = text.toLowerCase().indexOf(q);
  if (idx < 0) return text;
  return text.substring(0, idx) + '<mark>' + text.substring(idx, idx + q.length) + '</mark>' + text.substring(idx + q.length);
}

    var siblings = ARTIFACTS.filter(function(a) { return a.dynasty === ca.dynasty && a.id !== cid; });
    if (siblings.length > 0) {
      var dir = e.key === 'ArrowRight' ? 1 : -1;
      var ci = siblings.findIndex(function(a) { return a.id === cid; });
      var ni = ((ci >= 0 ? ci : -1) + dir + siblings.length) % siblings.length;
      navigateTo(siblings[ni].id);
    }
  }
});

var exploreBuilt = false;
function buildExplore() {
  if (exploreBuilt) return;
  exploreBuilt = true;
  var grid = document.getElementById('exploreGrid');
  grid.innerHTML = '';
  ARTIFACTS.forEach(function(a) {
    var card = document.createElement('div');
    card.className = 'explore-card';
    card.dataset.id = a.id;
    var q1 = a.analyses && a.analyses.length ? a.analyses[0].q : a.essence;
    card.innerHTML = '<div class="explore-img" style="background-image:url(' + a.img + ')"></div><div class="explore-info"><div class="explore-name">' + a.name + '</div><div class="explore-era">' + a.era + '</div><div class="explore-question">' + q1 + '</div></div>';
    card.addEventListener('click', function() { toggleCompareSel(a.id); });
    grid.appendChild(card);
  });
}
function setMode(mode, doPush) {
  if (mode === state.mode && mode === 'explore' && exploreBuilt) return;
  state.mode = mode;
  document.getElementById('btnModeGuide').classList.toggle('active', mode === 'guide');
  document.getElementById('btnModeExplore').classList.toggle('active', mode === 'explore');
  var ev = document.getElementById('exploreView');
  if (mode === 'explore') {
    buildExplore();
    closeAll();
    filterBar.classList.add('hidden');
    ev.classList.add('active');
    setTimeout(function() { ev.classList.add('fade-in'); }, 30);
  } else {
    filterBar.classList.remove('hidden');
    ev.classList.remove('fade-in');
    setTimeout(function() { ev.classList.remove('active'); }, 400);
  }
  if (doPush !== false) updateUrl();
}

/* ===== A2：探索模式对比勾选 ===== */
function toggleCompareSel(id) {
  var i = state.compareSel.indexOf(id);
  if (i >= 0) { state.compareSel.splice(i, 1); }
  else {
    if (state.compareSel.length >= 2) return;
    state.compareSel.push(id);
  }
  document.querySelectorAll('.explore-card').forEach(function(c) {
    c.classList.toggle('checked', state.compareSel.indexOf(c.dataset.id) >= 0);
  });
  var bar = document.getElementById('compareBar');
  if (state.compareSel.length === 2) {
    document.getElementById('compareBarNames').textContent = state.compareSel.map(function(id) { return artifactById[id].name; }).join('  ↔  ');
    bar.classList.add('active');
  } else {
    bar.classList.remove('active');
  }
}
function clearCompareSel() {
  state.compareSel = [];
  document.querySelectorAll('.explore-card').forEach(function(c) { c.classList.remove('checked'); });
  document.getElementById('compareBar').classList.remove('active');
}

/* ===== A3：兴趣锚点（分析维度停留时长 → sessionStorage） ===== */
function loadInterest() {
  try { return JSON.parse(sessionStorage.getItem('yigu-interest') || '{}'); }
  catch (e) { return {}; }
}
function saveInterest() {
  try { sessionStorage.setItem('yigu-interest', JSON.stringify(interest)); } catch (e) {}
}
var interestTimer = null;
function startInterestTracking() {
  stopInterestTracking();
  interestTimer = setInterval(function() {
    var ov = analysisOverlay.getBoundingClientRect();
    analysisInner.querySelectorAll('.analysis-step.revealed').forEach(function(s) {
      var r = s.getBoundingClientRect();
      var top = Math.max(r.top, ov.top), bottom = Math.min(r.bottom, ov.bottom);
      var vis = (Math.max(0, bottom - top) / (r.height || 1));
      if (vis > 0.4 && s.dataset.dim) {
        interest[s.dataset.dim] = (interest[s.dataset.dim] || 0) + 0.5;
      }
    });
    saveInterest();
  }, 1000);
}
function stopInterestTracking() {
  if (interestTimer) { clearInterval(interestTimer); interestTimer = null; }
  saveInterest();
}

/* ===== B4：顶部金色滚动进度条 ===== */
function updateProgress() {
  var p = 0;
  if (analysisOverlay.classList.contains('active')) {
    var max = analysisOverlay.scrollHeight - analysisOverlay.clientHeight;
    p = max > 0 ? analysisOverlay.scrollTop / max : 0;
  } else {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    p = h > 0 ? window.pageYOffset / h : 0;
  }
  document.getElementById('scrollProgress').style.width = (p * 100) + '%';
}

(function initFlashlight() {
  if (window.matchMedia('(pointer:coarse)').matches) return;
  var fl = document.getElementById('flashlight');
  var ticking = false;
  document.addEventListener('mousemove', function(e) {
    if (state.selectedId || state.deepDiveId || state.mode === 'explore') { fl.classList.remove('active'); return; }
    if (!ticking) {
      requestAnimationFrame(function() {
        fl.style.background = 'radial-gradient(circle 280px at ' + e.clientX + 'px ' + e.clientY + 'px, transparent 0%, rgba(10,8,6,0.25) 55%, rgba(10,8,6,0.65) 100%)';
        ticking = false;
      });
      ticking = true;
    }
    if (!fl.classList.contains('active')) fl.classList.add('active');
  });
  document.addEventListener('mouseleave', function() { fl.classList.add('flashlight-off'); });
  document.addEventListener('mouseenter', function() { fl.classList.remove('flashlight-off'); });

  document.querySelectorAll('.wall-tile').forEach(function(tile) {

    tile.addEventListener('mouseenter', function(e) {
      if (state.selectedId || state.deepDiveId) return;
      if (window.matchMedia('(pointer:coarse)').matches) return;
      var id = e.target.dataset.artifactId; if (!id) return;
      var a = artifactById[id]; if (!a) return;
      ARTIFACTS.forEach(function(b) {
        if (b.id === id) return;
        if (b.dynasty === a.dynasty || b.mtag === a.mtag) {
          var rt = document.querySelector('.wall-tile[data-artifact-id="' + b.id + '"]');
          if (rt && !rt.classList.contains('hidden') && !rt.classList.contains('dimmed')) {
            rt.style.filter = 'sepia(0.1) hue-rotate(-3deg) saturate(1)';
          }
        }
      });
    });
    tile.addEventListener('mouseleave', function() {
      document.querySelectorAll('.wall-tile').forEach(function(t) {
        if (!t.classList.contains('dimmed') && !t.classList.contains('pulse')) t.style.filter = '';
      });
    });
  });
})();

/* ===== C5：无障碍 ARIA ===== */
(function initA11y() {
  cardOverlay.setAttribute('role', 'dialog');
  cardOverlay.setAttribute('aria-modal', 'true');
  analysisOverlay.setAttribute('role', 'dialog');
  analysisOverlay.setAttribute('aria-modal', 'true');
  document.getElementById('compareView').setAttribute('role', 'dialog');
  document.getElementById('compareView').setAttribute('aria-modal', 'true');
  document.getElementById('exploreView').setAttribute('aria-label', '探索馆藏');
  document.getElementById('btnModeGuide').setAttribute('aria-pressed', 'true');
  document.getElementById('btnModeExplore').setAttribute('aria-pressed', 'false');
})();

updateProgress();
restoreFromUrl();

</script>
